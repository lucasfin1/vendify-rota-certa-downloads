name: Verificador automático de rotas

on:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: automatic-route-import
  cancel-in-progress: false

jobs:
  import-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar automação
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar programação do painel e importar Excel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: "false"
        run: python route_importer.py
