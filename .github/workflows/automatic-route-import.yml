name: Importar rotas automaticamente

on:
  schedule:
    # 21:07 UTC corresponde a 18:07 em America/Sao_Paulo.
    # Evita o início exato da hora, quando o GitHub costuma ter mais filas.
    - cron: "*/15 * * * *"
    # Segunda tentativa caso o GitHub atrase ou descarte a primeira.
    - cron: "22 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automatic-route-import
  cancel-in-progress: false

jobs:
  import-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar automação
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar horário e importar Excel
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: python route_importer.py
